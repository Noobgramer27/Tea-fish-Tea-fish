<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Kamu 🌊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.4.0/tsparticles.confetti.bundle.min.js"></script>
<style>
  :root{
    --deep:#073B4C;
    --teal:#118AB2;
    --aqua:#06D6A0;
    --foam:#EAF7FB;
    --sand:#FFD166;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    font-family:'Nunito',sans-serif;
    background: linear-gradient(180deg, #0B4F6C 0%, #118AB2 45%, #06AED5 75%, #5FD0E0 100%);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow-x:hidden;
    overflow-y:auto;
    position:relative;
  }
  body{ padding: 2.5rem 0; }

  .bubble{
    position:fixed;
    bottom:-60px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15));
    opacity:.5;
    animation: rise linear infinite;
    pointer-events:none;
  }
  @keyframes rise{
    to{ transform: translateY(-110vh) translateX(10px); opacity:0; }
  }

  .wave-wrap{
    position:fixed;
    bottom:0; left:0; width:100%;
    line-height:0;
    z-index:1;
  }
  .wave-wrap svg{ width:100%; height:auto; display:block; }

  .card{
    position:relative;
    z-index:2;
    width:min(88vw, 380px);
    background: rgba(255,255,255,0.95);
    border-radius:22px;
    padding:2.6rem 2rem 2.2rem;
    text-align:center;
    box-shadow: 0 30px 60px -20px rgba(3,50,71,0.45), 0 0 0 1px rgba(6,214,160,0.25);
    transform: scale(.9) rotate(-1deg);
    opacity:0;
    animation: cardIn .9s cubic-bezier(.2,.9,.25,1) forwards .2s;
  }
  @keyframes cardIn{
    to{ transform: scale(1) rotate(0deg); opacity:1; }
  }

  .ring{
    width:46px;height:46px;
    margin:0 auto 1rem;
    border-radius:50%;
    background: linear-gradient(135deg, var(--teal), var(--aqua));
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;
  }

  .eyebrow{
    font-size:.72rem;
    letter-spacing:.06em;
    color: var(--teal);
    margin-bottom:.35rem;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:2.15rem;
    line-height:1.15;
    color: var(--deep);
    margin:0 0 .5rem;
  }
  h1 em{
    font-style:italic;
    color: var(--teal);
  }

  .sub{
    font-size:.95rem;
    color:#4A6B77;
    margin:0 0 1.6rem;
    line-height:1.5;
  }

  button{
    border:none;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:.95rem;
    color:#fff;
    background: linear-gradient(135deg, var(--teal), var(--aqua));
    padding:.85rem 1.5rem;
    border-radius:999px;
    width:100%;
    box-shadow: 0 10px 20px -8px rgba(17,138,178,0.55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover{
    transform: translateY(-2px);
    box-shadow: 0 14px 24px -8px rgba(17,138,178,0.6);
  }
  button:active{ transform: translateY(0); }

  .message{
    font-family:'Cormorant Garamond', serif;
    font-size:1.28rem;
    line-height:1.6;
    color: var(--deep);
    margin: 0 0 1.1rem;
    text-align:left;
  }

  .signature{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size:1.05rem;
    color: var(--teal);
    margin: 0 0 1.6rem;
  }

  .fade-in{
    opacity:0;
    animation: fadeUp .7s ease forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .wave-divider{
    display:flex;
    align-items:center;
    gap:.5rem;
    margin: 0 0 1.2rem;
  }
  .wave-divider span{
    flex:1;
    height:1px;
    background: linear-gradient(90deg, transparent, rgba(17,138,178,.35), transparent);
  }

  .step-dots{
    display:flex;
    justify-content:center;
    gap:.4rem;
    margin-top:1.1rem;
  }
  .step-dots span{
    width:7px;height:7px;border-radius:50%;
    background: rgba(17,138,178,.25);
    transition: background .2s ease, transform .2s ease;
  }
  .step-dots span.active{
    background: var(--teal);
    transform: scale(1.25);
  }
</style>
</head>
<body>

<div id="bubbles"></div>

<div class="wave-wrap">
  <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
    <path fill="#EAF7FB" fill-opacity="0.5" d="M0,64L60,74.7C120,85,240,107,360,101.3C480,96,600,64,720,58.7C840,53,960,75,1080,80C1200,85,1320,75,1380,69.3L1440,64L1440,150L0,150Z"></path>
  </svg>
</div>

<div class="card" id="kartu">
  <div class="ring">🌊</div>
  <p class="eyebrow">Ada sesuatu buat kamu</p>
  <h1>For, <em>you</em> 👀</h1>
  <p class="sub">Klik tombol di bawah, ada pesan kecil dariku.</p>
  <button onclick="halaman2()">Buka pesannya 💌</button>
  <div class="step-dots">
    <span class="active"></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<script>
  const container = document.getElementById("bubbles");
  for(let i=0;i<20;i++){
    const b = document.createElement("div");
    b.className = "bubble";
    const size = 6 + Math.random()*22;
    b.style.width = size + "px";
    b.style.height = size + "px";
    b.style.left = Math.random()*100 + "vw";
    b.style.animationDuration = (5 + Math.random()*7) + "s";
    b.style.animationDelay = (Math.random()*6) + "s";
    container.appendChild(b);
  }

  function tembakConfetti(colors){
    try{
      if (typeof confetti === "function") {
        confetti({
          particleCount: 100,
          spread: 75,
          origin: { y: .6 },
          colors: colors
        });
      }
    }catch(e){
      console.warn("Confetti gagal dimuat, lanjut tanpa efek confetti:", e);
    }
  }

  // HALAMAN 2 — kata-kata flirt pertama (edit teksnya sesuka kamu)
  function halaman2(){
    const kartu = document.getElementById("kartu");
    kartu.innerHTML = `
      <div class="ring fade-in" style="animation-delay:.05s">💙</div>
      <p class="eyebrow fade-in" style="animation-delay:.1s">Sebelum lanjut...</p>
      <div class="wave-divider fade-in" style="animation-delay:.15s"><span></span>🌊<span></span></div>
      <p class="message fade-in" style="animation-delay:.2s">
        Kadang heran sm orng yg jago gombal kok bisa ya kepikiran kata'ny? sedangkan dipikiranku cma kamu..
      </p>
      <button class="fade-in" style="animation-delay:.3s;" onclick="halaman3()">Lanjut →</button>
      <div class="step-dots fade-in" style="animation-delay:.35s">
        <span></span><span class="active"></span><span></span><span></span><span></span>
      </div>
    `;
  }

  // HALAMAN 3 — kata-kata flirt kedua (edit teksnya sesuka kamu)
  function halaman3(){
    const kartu = document.getElementById("kartu");
    kartu.innerHTML = `
      <div class="ring fade-in" style="animation-delay:.05s">😳</div>
      <p class="eyebrow fade-in" style="animation-delay:.1s">Satu lagi deh...</p>
      <div class="wave-divider fade-in" style="animation-delay:.15s"><span></span>🌊<span></span></div>
      <p class="message fade-in" style="animation-delay:.2s">
        kamu cuci muka make le minerale ya? soalnya kek ada manis manis nya gituu.
      </p>
      <button class="fade-in" style="animation-delay:.3s;" onclick="halaman4()">Lanjut →</button>
      <div class="step-dots fade-in" style="animation-delay:.35s">
        <span></span><span></span><span class="active"></span><span></span><span></span>
      </div>
    `;
  }

  // HALAMAN 4 — kata-kata flirt ketiga (edit teksnya sesuka kamu)
  function halaman4(){
    const kartu = document.getElementById("kartu");
    kartu.innerHTML = `
      <div class="ring fade-in" style="animation-delay:.05s">🙈</div>
      <p class="eyebrow fade-in" style="animation-delay:.1s">Terakhir deh, janji...</p>
      <div class="wave-divider fade-in" style="animation-delay:.15s"><span></span>🌊<span></span></div>
      <p class="message fade-in" style="animation-delay:.2s">
        aduh kyknya aq amnesia deh, aq lupa semua termasuk muka mu, &gt;\\&lt;
      </p>
      <button class="fade-in" style="animation-delay:.3s;" onclick="halaman5()">Lanjut →</button>
      <div class="step-dots fade-in" style="animation-delay:.35s">
        <span></span><span></span><span></span><span class="active"></span><span></span>
      </div>
    `;
  }

  // HALAMAN 5 — ucapan happy birthday
  function halaman5(){
    tembakConfetti(["#118AB2","#06D6A0","#FFD166","#EAF7FB"]);

    const kartu = document.getElementById("kartu");
    kartu.innerHTML = `
      <div class="ring fade-in" style="animation-delay:.05s">🎂</div>
      <p class="eyebrow fade-in" style="animation-delay:.1s">Dan yang paling penting...</p>
      <h1 class="fade-in" style="animation-delay:.15s; font-size:1.9rem;">Happy Birthday, <em>Saffa</em> 🎉</h1>
      <p class="message fade-in" style="animation-delay:.2s">
        Di hari spesial ini, aku mau ngucapin semoga kamu selalu diberi kesehatan, kebahagiaan, dan semua hal baik yang kamu impikan. Semoga tahun ini jadi tahun yang penuh pencapaian buat kamu.
        <br><br>
        Aku juga mau bilang, kehadiran kamu tuh selalu berhasil bikin hari-hariku jadi lebih berwarna. Entah itu dari obrolan random di TikTok dan ig, rasanya selalu ada hal kecil yang bikin aku bersyukur kenal kamu.
        <br><br>
        Semoga di umur yang baru ini kamu makin dikelilingi orang-orang yang sayang sama kamu, makin percaya diri sama semua mimpi-mimpimu, dan makin bahagia setiap harinya. Selamat ulang tahun! 🎂✨
      </p>
      <p class="signature fade-in" style="animation-delay:.3s">— dari aku, yang lagi salah tingkah</p>
      <button class="fade-in" style="animation-delay:.4s; background:linear-gradient(135deg,#073B4C,#118AB2);" onclick="location.reload()">Tutup kartu</button>
      <div class="step-dots fade-in" style="animation-delay:.45s">
        <span></span><span></span><span></span><span></span><span class="active"></span>
      </div>
    `;
  }
</script>

</body>
</html>
